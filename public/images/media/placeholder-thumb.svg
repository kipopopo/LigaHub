<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" rx="12" fill="url(#tbg)"/>
  <!-- Play button -->
  <circle cx="160" cy="80" r="28" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <polygon points="152,66 152,94 176,80" fill="rgba(255,255,255,0.5)"/>
  <text x="160" y="140" text-anchor="middle" font-family="Arial" font-size="12" fill="#a0aec0">Video Thumbnail</text>
  <text x="160" y="160" text-anchor="middle" font-family="Arial" font-size="9" fill="#718096">Click to play</text>
</svg>
